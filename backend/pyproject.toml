[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sihps-nowcast"
version = "0.1.0"
description = "Hyper-local convective-scale weather nowcasting for India (SIH 2026 prototype)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "SIHPS Team" }]
dependencies = [
  "numpy>=1.26,<3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "SQLAlchemy>=2.0",
  "celery>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "captum>=0.7"]
sat = ["xarray>=2024.3.0", "h5py>=3.11", "netCDF4>=1.6.5", "rasterio>=1.3.9", "rioxarray>=0.15"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "matplotlib>=3.8"]

[project.scripts]
sihps-train = "training.train:main"
sihps-evaluate = "training.evaluate:main"

[tool.setuptools.packages.find]
include = ["app*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "torch: requires PyTorch (skipped when torch is not installed)",
  "slow: long-running end-to-end test",
  "live_source: hits a real external service; opt in with SIHPS_LIVE_SOURCE_TESTS=1",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
